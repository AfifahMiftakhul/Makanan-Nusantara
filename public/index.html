<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nusantara Food</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="logo">
      🍜
      <span>Nusantara Food</span>
    </div>

    <a href="/login" class="login-button">
      Login Admin
    </a>

  </nav>


  <!-- HERO -->
  <section class="hero">

    <div class="hero-content">

      <h1>
        Rasakan Cita<br>
        Rasa Nusantara 🇮🇩
      </h1>

      <p>
        Jelajahi berbagai makanan khas Indonesia
        dari berbagai daerah.
      </p>

    </div>

  </section>


  <!-- MENU -->
  <main class="menu-section">

    <div class="section-title">
      <h2>Daftar Makanan</h2>
      <p>Berbagai makanan khas Nusantara</p>
    </div>

    <div id="food-list" class="food-grid">
      <!-- Data makanan dari Supabase -->
    </div>

  </main>


  <script>

    async function loadFoods() {

      try {

        const response = await fetch("/foods");
        const foods = await response.json();

        const foodList = document.getElementById("food-list");

        foodList.innerHTML = "";

        foods.forEach(food => {

          foodList.innerHTML += `
            <div class="food-card">

              <div class="food-image">
                🍛 
              </div>

              <div class="food-content">

                <h3>${food.name}</h3>

                <p class="region">
                  📍 ${food.region}
                </p>

                <p class="description">
                  ${food.description}
                </p>

                <p class="price">
                  Rp ${Number(food.price).toLocaleString("id-ID")}
                </p>

              </div>

            </div>
          `;

        });

      } catch (error) {

        console.error(error);

      }

    }

    loadFoods();

  </script>

</body>
</html>
