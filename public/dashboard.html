<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin - Nusantara Food</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="dashboard">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="dashboard-header">

      <div>
        <h1>🍜 Nusantara Food</h1>
        <p>Dashboard Admin</p>
      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        Keluar
      </button>

    </header>


    <!-- =========================
         FOOD
    ========================== -->

    <main>

      <div class="dashboard-title">

        <div>
          <h2>Daftar Makanan</h2>
          <p>Kelola data makanan khas Indonesia</p>
        </div>

        <button
          id="showFoodFormBtn"
          class="add-btn"
          type="button"
        >
          + Tambah Makanan
        </button>

      </div>


      <!-- FORM FOOD -->

      <div
        id="foodFormContainer"
        class="form-container"
      >

        <h3 id="foodFormTitle">
          Tambah Makanan
        </h3>

        <form id="foodForm">

          <input
            type="hidden"
            id="foodId"
          >

          <div class="form-group">

            <label for="foodName">
              Nama Makanan
            </label>

            <input
              type="text"
              id="foodName"
              placeholder="Contoh: Rendang"
              required
            >

          </div>


          <div class="form-group">

            <label for="foodRegion">
              Daerah
            </label>

            <input
              type="text"
              id="foodRegion"
              placeholder="Contoh: Sumatera Barat"
              required
            >

          </div>


          <div class="form-group">

            <label for="foodPrice">
              Harga
            </label>

            <input
              type="number"
              id="foodPrice"
              placeholder="Contoh: 25000"
              required
            >

          </div>


          <div class="form-group">

            <label for="foodCategory">
              Kategori
            </label>

            <select
              id="foodCategory"
              required
            >
              <option value="">
                Pilih kategori
              </option>
            </select>

          </div>


          <div class="form-group">

            <label for="foodDescription">
              Deskripsi
            </label>

            <textarea
              id="foodDescription"
              placeholder="Deskripsi makanan"
              required
            ></textarea>

          </div>


          <button
            type="submit"
            class="btn-login"
          >
            Simpan
          </button>


          <button
            type="button"
            id="cancelFoodBtn"
            class="cancel-btn"
          >
            Batal
          </button>

        </form>

      </div>


      <!-- LIST FOOD -->

      <div
        id="food-list"
        class="food-list"
      >
        <p>Memuat data makanan...</p>
      </div>


      <!-- =========================
           CATEGORY
      ========================== -->

      <div
        class="dashboard-title"
        style="margin-top: 60px;"
      >

        <div>
          <h2>Daftar Kategori</h2>
          <p>Kelola kategori makanan</p>
        </div>

        <button
          id="showCategoryFormBtn"
          class="add-btn"
          type="button"
        >
          + Tambah Kategori
        </button>

      </div>


      <!-- FORM CATEGORY -->

      <div
        id="categoryFormContainer"
        class="form-container"
      >

        <h3 id="categoryFormTitle">
          Tambah Kategori
        </h3>

        <form id="categoryForm">

          <input
            type="hidden"
            id="categoryId"
          >

          <div class="form-group">

            <label for="categoryName">
              Nama Kategori
            </label>

            <input
              type="text"
              id="categoryName"
              placeholder="Contoh: Makanan Berat"
              required
            >

          </div>


          <button
            type="submit"
            class="btn-login"
          >
            Simpan
          </button>


          <button
            type="button"
            id="cancelCategoryBtn"
            class="cancel-btn"
          >
            Batal
          </button>

        </form>

      </div>


      <!-- LIST CATEGORY -->

      <div
        id="category-list"
        class="food-list"
      >
        <p>Memuat kategori...</p>
      </div>

    </main>

  </div>


  <script>

    // ==================================================
    // CEK LOGIN
    // ==================================================

    const token = localStorage.getItem("adminToken");

    if (!token) {
      window.location.href = "/login";
    }


    // ==================================================
    // HELPER REQUEST
    // ==================================================

    async function apiRequest(url, options = {}) {

      const currentToken =
        localStorage.getItem("adminToken");

      if (!currentToken) {
        window.location.href = "/login";
        return null;
      }

      const response = await fetch(url, {
        ...options,

        headers: {
          "Content-Type": "application/json",

          "Authorization":
            `Bearer ${currentToken}`,

          ...(options.headers || {})
        }
      });


      // Token tidak valid / expired

      if (response.status === 401) {

        localStorage.removeItem("adminToken");

        window.location.href = "/login";

        return null;
      }


      const data = await response.json();

      return {
        response,
        data
      };
    }


    // ==================================================
    // LOGOUT
    // ==================================================

    function logout() {

      // Hapus JWT
      localStorage.removeItem("adminToken");

      // Kembali ke landing page customer
      window.location.href = "/";
    }


    // Tombol logout
    document
      .getElementById("logoutBtn")
      .addEventListener("click", logout);


    // ==================================================
    // LOAD FOODS
    // ==================================================

    async function loadFoods() {

      const foodList =
        document.getElementById("food-list");

      foodList.innerHTML =
        "<p>Memuat data makanan...</p>";


      try {

        const result =
          await apiRequest("/foods");

        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal mengambil data makanan"
          );
        }


        foodList.innerHTML = "";


        if (data.length === 0) {

          foodList.innerHTML = `
            <p>Belum ada data makanan.</p>
          `;

          return;
        }


        data.forEach(food => {

          const card =
            document.createElement("div");

          card.className =
            "food-card";


          card.innerHTML = `

            <div>

              <h3>
                ${escapeHtml(food.name)}
              </h3>

              <p class="region">
                📍 ${escapeHtml(food.region)}
              </p>

              <p>
                ${escapeHtml(
                  food.description || "-"
                )}
              </p>

            </div>


            <div class="food-price">
              Rp ${Number(food.price)
                .toLocaleString("id-ID")}
            </div>


            <div class="action-buttons">

              <button
                class="edit-btn"
                type="button"
                onclick="editFood(
                  ${Number(food.id)},
                  ${JSON.stringify(food.name)},
                  ${JSON.stringify(food.region)},
                  ${Number(food.price)},
                  ${Number(food.category_id)},
                  ${JSON.stringify(food.description || "")}
                )"
              >
                Edit
              </button>


              <button
                class="delete-btn"
                type="button"
                onclick="deleteFood(${Number(food.id)})"
              >
                Hapus
              </button>

            </div>

          `;


          foodList.appendChild(card);
        });


      } catch (error) {

        foodList.innerHTML = `

          <div class="error">
            Gagal memuat makanan:
            ${escapeHtml(error.message)}
          </div>

        `;
      }
    }


    // ==================================================
    // ESCAPE HTML
    // ==================================================

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ==================================================
    // LOAD CATEGORIES
    // ==================================================

    async function loadCategories() {

      const categoryList =
        document.getElementById("category-list");

      const select =
        document.getElementById("foodCategory");


      try {

        const result =
          await apiRequest("/categories");

        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal mengambil kategori"
          );
        }


        categoryList.innerHTML = "";


        if (data.length === 0) {

          categoryList.innerHTML = `
            <p>Belum ada kategori.</p>
          `;
        }


        data.forEach(category => {

          const card =
            document.createElement("div");

          card.className =
            "food-card";


          card.innerHTML = `

            <div>

              <h3>
                ${escapeHtml(category.name)}
              </h3>

            </div>


            <div class="action-buttons">

              <button
                class="edit-btn"
                type="button"
                onclick="editCategory(
                  ${Number(category.id)},
                  ${JSON.stringify(category.name)}
                )"
              >
                Edit
              </button>


              <button
                class="delete-btn"
                type="button"
                onclick="deleteCategory(
                  ${Number(category.id)}
                )"
              >
                Hapus
              </button>

            </div>

          `;


          categoryList.appendChild(card);
        });


        // Dropdown kategori

        select.innerHTML = `
          <option value="">
            Pilih kategori
          </option>
        `;


        data.forEach(category => {

          const option =
            document.createElement("option");

          option.value =
            category.id;

          option.textContent =
            category.name;

          select.appendChild(option);
        });


      } catch (error) {

        categoryList.innerHTML = `

          <div class="error">
            Gagal memuat kategori:
            ${escapeHtml(error.message)}
          </div>

        `;
      }
    }


    // ==================================================
    // SHOW FOOD FORM
    // ==================================================

    document
      .getElementById("showFoodFormBtn")
      .addEventListener("click", () => {

        document
          .getElementById("foodForm")
          .reset();

        document
          .getElementById("foodId")
          .value = "";

        document
          .getElementById("foodFormTitle")
          .textContent = "Tambah Makanan";

        document
          .getElementById("foodFormContainer")
          .classList.add("active");

      });


    // ==================================================
    // CANCEL FOOD FORM
    // ==================================================

    document
      .getElementById("cancelFoodBtn")
      .addEventListener(
        "click",
        resetFoodForm
      );


    function resetFoodForm() {

      document
        .getElementById("foodForm")
        .reset();

      document
        .getElementById("foodId")
        .value = "";

      document
        .getElementById("foodFormTitle")
        .textContent = "Tambah Makanan";

      document
        .getElementById("foodFormContainer")
        .classList.remove("active");
    }


    // ==================================================
    // TAMBAH / UPDATE FOOD
    // ==================================================

    document
      .getElementById("foodForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const id =
            document.getElementById("foodId").value;


          const foodData = {

            category_id:
              Number(
                document
                  .getElementById("foodCategory")
                  .value
              ),

            name:
              document
                .getElementById("foodName")
                .value,

            region:
              document
                .getElementById("foodRegion")
                .value,

            price:
              Number(
                document
                  .getElementById("foodPrice")
                  .value
              ),

            description:
              document
                .getElementById("foodDescription")
                .value
          };


          try {

            let result;


            // UPDATE

            if (id) {

              result =
                await apiRequest(
                  `/foods/${id}`,
                  {
                    method: "PUT",

                    body:
                      JSON.stringify(foodData)
                  }
                );

            }

            // CREATE

            else {

              result =
                await apiRequest(
                  "/foods",
                  {
                    method: "POST",

                    body:
                      JSON.stringify(foodData)
                  }
                );
            }


            if (!result) return;


            const {
              response,
              data
            } = result;


            if (!response.ok) {

              throw new Error(
                data.message ||
                "Gagal menyimpan makanan"
              );
            }


            alert(
              id
                ? "Makanan berhasil diupdate!"
                : "Makanan berhasil ditambahkan!"
            );


            resetFoodForm();

            await loadFoods();

          } catch (error) {

            alert(
              "Gagal: " +
              error.message
            );
          }

        }
      );


    // ==================================================
    // EDIT FOOD
    // ==================================================

    function editFood(
      id,
      name,
      region,
      price,
      categoryId,
      description
    ) {

      document
        .getElementById("foodId")
        .value = id;

      document
        .getElementById("foodName")
        .value = name;

      document
        .getElementById("foodRegion")
        .value = region;

      document
        .getElementById("foodPrice")
        .value = price;

      document
        .getElementById("foodCategory")
        .value = categoryId;

      document
        .getElementById("foodDescription")
        .value = description;

      document
        .getElementById("foodFormTitle")
        .textContent = "Edit Makanan";

      document
        .getElementById("foodFormContainer")
        .classList.add("active");


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    // ==================================================
    // DELETE FOOD
    // ==================================================

    async function deleteFood(id) {

      const yakin =
        confirm(
          "Apakah kamu yakin ingin menghapus makanan ini?"
        );


      if (!yakin) return;


      try {

        const result =
          await apiRequest(
            `/foods/${id}`,
            {
              method: "DELETE"
            }
          );


        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal menghapus makanan"
          );
        }


        alert(
          "Makanan berhasil dihapus!"
        );


        await loadFoods();

      } catch (error) {

        alert(
          "Gagal: " +
          error.message
        );
      }
    }


    // ==================================================
    // SHOW CATEGORY FORM
    // ==================================================

    document
      .getElementById("showCategoryFormBtn")
      .addEventListener("click", () => {

        document
          .getElementById("categoryForm")
          .reset();

        document
          .getElementById("categoryId")
          .value = "";

        document
          .getElementById("categoryFormTitle")
          .textContent =
            "Tambah Kategori";

        document
          .getElementById("categoryFormContainer")
          .classList.add("active");

      });


    // ==================================================
    // CANCEL CATEGORY
    // ==================================================

    document
      .getElementById("cancelCategoryBtn")
      .addEventListener(
        "click",
        resetCategoryForm
      );


    function resetCategoryForm() {

      document
        .getElementById("categoryForm")
        .reset();

      document
        .getElementById("categoryId")
        .value = "";

      document
        .getElementById("categoryFormTitle")
        .textContent =
          "Tambah Kategori";

      document
        .getElementById("categoryFormContainer")
        .classList.remove("active");
    }


    // ==================================================
    // TAMBAH / UPDATE CATEGORY
    // ==================================================

    document
      .getElementById("categoryForm")
      .addEventListener(
        "submit",
        async function(e) {

          e.preventDefault();


          const id =
            document
              .getElementById("categoryId")
              .value;


          const categoryData = {

            name:
              document
                .getElementById("categoryName")
                .value
          };


          try {

            let result;


            // UPDATE

            if (id) {

              result =
                await apiRequest(
                  `/categories/${id}`,
                  {
                    method: "PUT",

                    body:
                      JSON.stringify(
                        categoryData
                      )
                  }
                );

            }

            // CREATE

            else {

              result =
                await apiRequest(
                  "/categories",
                  {
                    method: "POST",

                    body:
                      JSON.stringify(
                        categoryData
                      )
                  }
                );
            }


            if (!result) return;


            const {
              response,
              data
            } = result;


            if (!response.ok) {

              throw new Error(
                data.message ||
                "Gagal menyimpan kategori"
              );
            }


            alert(
              id
                ? "Kategori berhasil diupdate!"
                : "Kategori berhasil ditambahkan!"
            );


            resetCategoryForm();

            await loadCategories();

          } catch (error) {

            alert(
              "Gagal: " +
              error.message
            );
          }

        }
      );


    // ==================================================
    // EDIT CATEGORY
    // ==================================================

    function editCategory(id, name) {

      document
        .getElementById("categoryId")
        .value = id;

      document
        .getElementById("categoryName")
        .value = name;

      document
        .getElementById("categoryFormTitle")
        .textContent =
          "Edit Kategori";

      document
        .getElementById("categoryFormContainer")
        .classList.add("active");


      window.scrollTo({
        top:
          document
            .getElementById("categoryFormContainer")
            .offsetTop - 30,

        behavior: "smooth"
      });
    }


    // ==================================================
    // DELETE CATEGORY
    // ==================================================

    async function deleteCategory(id) {

      const yakin =
        confirm(
          "Apakah kamu yakin ingin menghapus kategori ini?"
        );


      if (!yakin) return;


      try {

        const result =
          await apiRequest(
            `/categories/${id}`,
            {
              method: "DELETE"
            }
          );


        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal menghapus kategori"
          );
        }


        alert(
          "Kategori berhasil dihapus!"
        );


        await loadCategories();
        await loadFoods();

      } catch (error) {

        alert(
          "Gagal: " +
          error.message
        );
      }
    }


    // ==================================================
    // LOAD DATA
    // ==================================================

    loadCategories();
    loadFoods();

  </script>

</body>
</html>
