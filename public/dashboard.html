<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard Admin - Nusantara Food</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="dashboard">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="dashboard-header">

      <div>
        <h1>🍜 Nusantara Food</h1>
        <p>Dashboard Admin</p>
      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        Keluar
      </button>

    </header>


    <!-- =========================
         FOOD
    ========================== -->

    <main>

      <div class="dashboard-title">

        <div>
          <h2>Daftar Makanan</h2>
          <p>Kelola data makanan khas Indonesia</p>
        </div>

        <button
          id="showFoodFormBtn"
          class="add-btn"
          type="button"
        >
          + Tambah Makanan
        </button>

      </div>


      <!-- =========================
           FORM FOOD
      ========================== -->

      <div
        id="foodFormContainer"
        class="form-container"
      >

        <h3 id="foodFormTitle">
          Tambah Makanan
        </h3>

        <form id="foodForm">

          <input
            type="hidden"
            id="foodId"
          >


          <div class="form-group">

            <label for="foodName">
              Nama Makanan
            </label>

            <input
              type="text"
              id="foodName"
              placeholder="Contoh: Rendang"
              required
            >

          </div>


          <div class="form-group">

            <label for="foodRegion">
              Daerah
            </label>

            <input
              type="text"
              id="foodRegion"
              placeholder="Contoh: Sumatera Barat"
              required
            >

          </div>


          <div class="form-group">

            <label for="foodPrice">
              Harga
            </label>

            <input
              type="number"
              id="foodPrice"
              placeholder="Contoh: 25000"
              required
            >

          </div>


          <div class="form-group">

            <label for="foodCategory">
              Kategori
            </label>

            <select
              id="foodCategory"
              required
            >

              <option value="">
                Pilih kategori
              </option>

            </select>

          </div>


          <div class="form-group">

            <label for="foodDescription">
              Deskripsi
            </label>

            <textarea
              id="foodDescription"
              placeholder="Deskripsi makanan"
              required
            ></textarea>

          </div>


          <button
            type="submit"
            class="btn-login"
          >
            Simpan
          </button>


          <button
            type="button"
            id="cancelFoodBtn"
            class="cancel-btn"
          >
            Batal
          </button>

        </form>

      </div>


      <!-- =========================
           LIST FOOD
      ========================== -->

      <div
        id="food-list"
        class="food-list"
      >
        <p>Memuat data makanan...</p>
      </div>


      <!-- =========================
           CATEGORY
      ========================== -->

      <div
        class="dashboard-title"
        style="margin-top: 60px;"
      >

        <div>
          <h2>Daftar Kategori</h2>
          <p>Kelola kategori makanan</p>
        </div>

        <button
          id="showCategoryFormBtn"
          class="add-btn"
          type="button"
        >
          + Tambah Kategori
        </button>

      </div>


      <!-- =========================
           FORM CATEGORY
      ========================== -->

      <div
        id="categoryFormContainer"
        class="form-container"
      >

        <h3 id="categoryFormTitle">
          Tambah Kategori
        </h3>

        <form id="categoryForm">

          <input
            type="hidden"
            id="categoryId"
          >


          <div class="form-group">

            <label for="categoryName">
              Nama Kategori
            </label>

            <input
              type="text"
              id="categoryName"
              placeholder="Contoh: Makanan Berat"
              required
            >

          </div>


          <button
            type="submit"
            class="btn-login"
          >
            Simpan
          </button>


          <button
            type="button"
            id="cancelCategoryBtn"
            class="cancel-btn"
          >
            Batal
          </button>

        </form>

      </div>


      <!-- =========================
           LIST CATEGORY
      ========================== -->

      <div
        id="category-list"
        class="food-list"
      >
        <p>Memuat kategori...</p>
      </div>

    </main>

  </div>


  <script>

    // ==================================================
    // CEK LOGIN
    // ==================================================

    const token =
      localStorage.getItem("adminToken");

    if (!token) {

      window.location.href = "/login";

    }


    // ==================================================
    // HELPER REQUEST
    // ==================================================

    async function apiRequest(
      url,
      options = {}
    ) {

      const currentToken =
        localStorage.getItem("adminToken");


      if (!currentToken) {

        window.location.href = "/login";

        return null;

      }


      const response =
        await fetch(
          url,
          {
            ...options,

            headers: {

              "Content-Type":
                "application/json",

              "Authorization":
                `Bearer ${currentToken}`,

              ...(options.headers || {})

            }

          }
        );


      // Token invalid / expired

      if (response.status === 401) {

        localStorage.removeItem(
          "adminToken"
        );

        window.location.href =
          "/login";

        return null;

      }


      const data =
        await response.json();


      return {
        response,
        data
      };

    }


    // ==================================================
    // LOGOUT
    // ==================================================

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        function () {

          localStorage.removeItem(
            "adminToken"
          );

          window.location.href = "/";

        }
      );


    // ==================================================
    // LOAD FOODS
    // ==================================================

    async function loadFoods() {

      const foodList =
        document.getElementById(
          "food-list"
        );


      foodList.innerHTML =
        "<p>Memuat data makanan...</p>";


      try {

        const result =
          await apiRequest(
            "/foods"
          );


        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal mengambil data makanan"
          );

        }


        foodList.innerHTML = "";


        if (data.length === 0) {

          foodList.innerHTML = `
            <p>Belum ada data makanan.</p>
          `;

          return;

        }


        data.forEach(food => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "food-card";


          // =========================
          // CONTENT
          // =========================

          const content =
            document.createElement(
              "div"
            );


          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            food.name;


          const region =
            document.createElement(
              "p"
            );

          region.className =
            "region";

          region.textContent =
            `📍 ${food.region}`;


          const description =
            document.createElement(
              "p"
            );

          description.textContent =
            food.description || "-";


          content.appendChild(
            title
          );

          content.appendChild(
            region
          );

          content.appendChild(
            description
          );


          // =========================
          // PRICE
          // =========================

          const price =
            document.createElement(
              "div"
            );

          price.className =
            "food-price";

          price.textContent =
            `Rp ${Number(food.price)
              .toLocaleString("id-ID")}`;


          // =========================
          // ACTIONS
          // =========================

          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "action-buttons";


          // EDIT BUTTON

          const editButton =
            document.createElement(
              "button"
            );

          editButton.type =
            "button";

          editButton.className =
            "edit-btn";

          editButton.textContent =
            "Edit";


          editButton.addEventListener(
            "click",
            function () {

              editFood(food);

            }
          );


          // DELETE BUTTON

          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.type =
            "button";

          deleteButton.className =
            "delete-btn";

          deleteButton.textContent =
            "Hapus";


          deleteButton.addEventListener(
            "click",
            function () {

              deleteFood(
                food.id
              );

            }
          );


          actions.appendChild(
            editButton
          );

          actions.appendChild(
            deleteButton
          );


          // =========================
          // CARD
          // =========================

          card.appendChild(
            content
          );

          card.appendChild(
            price
          );

          card.appendChild(
            actions
          );


          foodList.appendChild(
            card
          );

        });


      } catch (error) {

        foodList.innerHTML = `

          <div class="error">

            Gagal memuat makanan:
            ${error.message}

          </div>

        `;

      }

    }


    // ==================================================
    // LOAD CATEGORIES
    // ==================================================

    async function loadCategories() {

      const categoryList =
        document.getElementById(
          "category-list"
        );


      const categorySelect =
        document.getElementById(
          "foodCategory"
        );


      try {

        const result =
          await apiRequest(
            "/categories"
          );


        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal mengambil kategori"
          );

        }


        categoryList.innerHTML =
          "";


        if (data.length === 0) {

          categoryList.innerHTML = `
            <p>Belum ada kategori.</p>
          `;

        }


        data.forEach(category => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "food-card";


          const content =
            document.createElement(
              "div"
            );


          const title =
            document.createElement(
              "h3"
            );

          title.textContent =
            category.name;


          content.appendChild(
            title
          );


          const actions =
            document.createElement(
              "div"
            );

          actions.className =
            "action-buttons";


          // EDIT CATEGORY

          const editButton =
            document.createElement(
              "button"
            );

          editButton.type =
            "button";

          editButton.className =
            "edit-btn";

          editButton.textContent =
            "Edit";


          editButton.addEventListener(
            "click",
            function () {

              editCategory(
                category
              );

            }
          );


          // DELETE CATEGORY

          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.type =
            "button";

          deleteButton.className =
            "delete-btn";

          deleteButton.textContent =
            "Hapus";


          deleteButton.addEventListener(
            "click",
            function () {

              deleteCategory(
                category.id
              );

            }
          );


          actions.appendChild(
            editButton
          );

          actions.appendChild(
            deleteButton
          );


          card.appendChild(
            content
          );

          card.appendChild(
            actions
          );


          categoryList.appendChild(
            card
          );

        });


        // =========================
        // DROPDOWN CATEGORY
        // =========================

        categorySelect.innerHTML = `

          <option value="">
            Pilih kategori
          </option>

        `;


        data.forEach(category => {

          const option =
            document.createElement(
              "option"
            );


          option.value =
            category.id;


          option.textContent =
            category.name;


          categorySelect.appendChild(
            option
          );

        });


      } catch (error) {

        categoryList.innerHTML = `

          <div class="error">

            Gagal memuat kategori:
            ${error.message}

          </div>

        `;

      }

    }


    // ==================================================
    // SHOW FOOD FORM
    // ==================================================

    document
      .getElementById(
        "showFoodFormBtn"
      )
      .addEventListener(
        "click",
        function () {

          document
            .getElementById(
              "foodForm"
            )
            .reset();


          document
            .getElementById(
              "foodId"
            )
            .value = "";


          document
            .getElementById(
              "foodFormTitle"
            )
            .textContent =
              "Tambah Makanan";


          document
            .getElementById(
              "foodFormContainer"
            )
            .classList.add(
              "active"
            );

        }
      );


    // ==================================================
    // CANCEL FOOD
    // ==================================================

    document
      .getElementById(
        "cancelFoodBtn"
      )
      .addEventListener(
        "click",
        resetFoodForm
      );


    function resetFoodForm() {

      document
        .getElementById(
          "foodForm"
        )
        .reset();


      document
        .getElementById(
          "foodId"
        )
        .value = "";


      document
        .getElementById(
          "foodFormTitle"
        )
        .textContent =
          "Tambah Makanan";


      document
        .getElementById(
          "foodFormContainer"
        )
        .classList.remove(
          "active"
        );

    }


    // ==================================================
    // EDIT FOOD
    // ==================================================

    function editFood(food) {

      document
        .getElementById(
          "foodId"
        )
        .value =
          food.id;


      document
        .getElementById(
          "foodName"
        )
        .value =
          food.name;


      document
        .getElementById(
          "foodRegion"
        )
        .value =
          food.region;


      document
        .getElementById(
          "foodPrice"
        )
        .value =
          food.price;


      document
        .getElementById(
          "foodCategory"
        )
        .value =
          food.category_id;


      document
        .getElementById(
          "foodDescription"
        )
        .value =
          food.description || "";


      document
        .getElementById(
          "foodFormTitle"
        )
        .textContent =
          "Edit Makanan";


      document
        .getElementById(
          "foodFormContainer"
        )
        .classList.add(
          "active"
        );


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    // ==================================================
    // ADD / UPDATE FOOD
    // ==================================================

    document
      .getElementById(
        "foodForm"
      )
      .addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();


          const id =
            document
              .getElementById(
                "foodId"
              )
              .value;


          const foodData = {

            category_id:
              Number(
                document
                  .getElementById(
                    "foodCategory"
                  )
                  .value
              ),

            name:
              document
                .getElementById(
                  "foodName"
                )
                .value,

            region:
              document
                .getElementById(
                  "foodRegion"
                )
                .value,

            price:
              Number(
                document
                  .getElementById(
                    "foodPrice"
                  )
                  .value
              ),

            description:
              document
                .getElementById(
                  "foodDescription"
                )
                .value

          };


          try {

            let result;


            // UPDATE

            if (id) {

              result =
                await apiRequest(
                  `/foods/${id}`,
                  {
                    method: "PUT",

                    body:
                      JSON.stringify(
                        foodData
                      )
                  }
                );

            }


            // CREATE

            else {

              result =
                await apiRequest(
                  "/foods",
                  {
                    method: "POST",

                    body:
                      JSON.stringify(
                        foodData
                      )
                  }
                );

            }


            if (!result) return;


            const {
              response,
              data
            } = result;


            if (!response.ok) {

              throw new Error(
                data.message ||
                "Gagal menyimpan makanan"
              );

            }


            alert(
              id
                ? "Makanan berhasil diupdate!"
                : "Makanan berhasil ditambahkan!"
            );


            resetFoodForm();

            await loadFoods();

          } catch (error) {

            alert(
              "Gagal: " +
              error.message
            );

          }

        }
      );


    // ==================================================
    // DELETE FOOD
    // ==================================================

    async function deleteFood(id) {

      const yakin =
        confirm(
          "Apakah kamu yakin ingin menghapus makanan ini?"
        );


      if (!yakin) return;


      try {

        const result =
          await apiRequest(
            `/foods/${id}`,
            {
              method: "DELETE"
            }
          );


        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal menghapus makanan"
          );

        }


        alert(
          "Makanan berhasil dihapus!"
        );


        await loadFoods();

      } catch (error) {

        alert(
          "Gagal: " +
          error.message
        );

      }

    }


    // ==================================================
    // SHOW CATEGORY FORM
    // ==================================================

    document
      .getElementById(
        "showCategoryFormBtn"
      )
      .addEventListener(
        "click",
        function () {

          document
            .getElementById(
              "categoryForm"
            )
            .reset();


          document
            .getElementById(
              "categoryId"
            )
            .value = "";


          document
            .getElementById(
              "categoryFormTitle"
            )
            .textContent =
              "Tambah Kategori";


          document
            .getElementById(
              "categoryFormContainer"
            )
            .classList.add(
              "active"
            );

        }
      );


    // ==================================================
    // CANCEL CATEGORY
    // ==================================================

    document
      .getElementById(
        "cancelCategoryBtn"
      )
      .addEventListener(
        "click",
        resetCategoryForm
      );


    function resetCategoryForm() {

      document
        .getElementById(
          "categoryForm"
        )
        .reset();


      document
        .getElementById(
          "categoryId"
        )
        .value = "";


      document
        .getElementById(
          "categoryFormTitle"
        )
        .textContent =
          "Tambah Kategori";


      document
        .getElementById(
          "categoryFormContainer"
        )
        .classList.remove(
          "active"
        );

    }


    // ==================================================
    // EDIT CATEGORY
    // ==================================================

    function editCategory(category) {

      document
        .getElementById(
          "categoryId"
        )
        .value =
          category.id;


      document
        .getElementById(
          "categoryName"
        )
        .value =
          category.name;


      document
        .getElementById(
          "categoryFormTitle"
        )
        .textContent =
          "Edit Kategori";


      document
        .getElementById(
          "categoryFormContainer"
        )
        .classList.add(
          "active"
        );


      window.scrollTo({
        top:
          document
            .getElementById(
              "categoryFormContainer"
            )
            .offsetTop - 30,

        behavior: "smooth"
      });

    }


    // ==================================================
    // ADD / UPDATE CATEGORY
    // ==================================================

    document
      .getElementById(
        "categoryForm"
      )
      .addEventListener(
        "submit",
        async function (e) {

          e.preventDefault();


          const id =
            document
              .getElementById(
                "categoryId"
              )
              .value;


          const categoryData = {

            name:
              document
                .getElementById(
                  "categoryName"
                )
                .value

          };


          try {

            let result;


            // UPDATE

            if (id) {

              result =
                await apiRequest(
                  `/categories/${id}`,
                  {
                    method: "PUT",

                    body:
                      JSON.stringify(
                        categoryData
                      )
                  }
                );

            }


            // CREATE

            else {

              result =
                await apiRequest(
                  "/categories",
                  {
                    method: "POST",

                    body:
                      JSON.stringify(
                        categoryData
                      )
                  }
                );

            }


            if (!result) return;


            const {
              response,
              data
            } = result;


            if (!response.ok) {

              throw new Error(
                data.message ||
                "Gagal menyimpan kategori"
              );

            }


            alert(
              id
                ? "Kategori berhasil diupdate!"
                : "Kategori berhasil ditambahkan!"
            );


            resetCategoryForm();

            await loadCategories();

          } catch (error) {

            alert(
              "Gagal: " +
              error.message
            );

          }

        }
      );


    // ==================================================
    // DELETE CATEGORY
    // ==================================================

    async function deleteCategory(id) {

      const yakin =
        confirm(
          "Apakah kamu yakin ingin menghapus kategori ini?"
        );


      if (!yakin) return;


      try {

        const result =
          await apiRequest(
            `/categories/${id}`,
            {
              method: "DELETE"
            }
          );


        if (!result) return;


        const {
          response,
          data
        } = result;


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Gagal menghapus kategori"
          );

        }


        alert(
          "Kategori berhasil dihapus!"
        );


        await loadCategories();
        await loadFoods();

      } catch (error) {

        alert(
          "Gagal: " +
          error.message
        );

      }

    }


    // ==================================================
    // LOAD DATA
    // ==================================================

    loadCategories();
    loadFoods();

  </script>

</body>
</html>
